<script>
    // Intercept API calls immediately before any React scripts load
    const originalFetch = window.fetch;
    window.fetch = async function(url, options) {
      // Helper to map a Supabase product to Stormty format
      const mapProduct = (p) => {
          let numericPrice = 0;
          if (typeof p.price === 'string') {
             numericPrice = parseFloat(p.price.replace(/[^\d,]/g, '').replace(',', '.')) || 0;
          } else {
             numericPrice = p.price;
          }
          return {
              _id: p.id,
              name: p.name,
              description: p.description || p.subtitle || "",
              price: numericPrice,
              banners: p.image ? [p.image] : [],
              entrega_automatica: true,
              pode_usar_cupom: true,
              active: true,
              estoque_count: p.stock
          };
      };

      if (typeof url === 'string' && url.includes('api.stormty.com/showcase-categories')) {
          try {
              const resProds = await originalFetch('/api/products');
              const prods = await resProds.json();
              const catMap = {};
              prods.forEach(p => {
                  const catName = p.category || "Outros";
                  if (!catMap[catName]) catMap[catName] = [];
                  
                  if (p.has_variations) {
                      catMap[catName].push({
                          type: "category",
                          id: p.id,
                          category: {
                              _id: p.id,
                              id: p.id,
                              name: p.name,
                              image: p.image || "",
                              banner: p.image || ""
                          }
                      });
                  } else {
                      catMap[catName].push({
                          type: "product",
                          id: p.id,
                          product: mapProduct(p)
                      });
                  }
              });
              const mockResponse = Object.keys(catMap).map((catName, idx) => ({
                  id: "cat_" + idx,
                  name: catName,
                  description: "",
                  index: idx,
                  items: catMap[catName]
              }));
              return new Response(JSON.stringify(mockResponse), { status: 200, headers: {'Content-Type': 'application/json'} });
          } catch(e) {
              console.error("Fetch showcase intercept error", e);
          }
      }

      if (typeof url === 'string' && url.match(/api\.stormty\.com\/categories\/([^\/]+)\/products/)) {
          const match = url.match(/api\.stormty\.com\/categories\/([^\/]+)\/products/);
          const catId = match[1];
          try {
              const resProds = await originalFetch('/api/products');
              const prods = await resProds.json();
              const parentProd = prods.find(p => p.id === catId);
              if (parentProd && parentProd.has_variations && parentProd.variations) {
                  const variationsArr = typeof parentProd.variations === 'string' ? JSON.parse(parentProd.variations) : parentProd.variations;
                  
                  const responseObj = {
                      id: parentProd.id,
                      name: parentProd.name,
                      description: parentProd.description || parentProd.subtitle || "",
                      banner: parentProd.image || "",
                      image: parentProd.image || "",
                      products: variationsArr.map((v, i) => {
                          let vPrice = 0;
                          if (typeof v.price === 'string') {
                              vPrice = parseFloat(v.price.replace(/[^\d,]/g, '').replace(',', '.')) || 0;
                          } else {
                              vPrice = v.price;
                          }
                          return {
                              _id: parentProd.id + "_" + i,
                              name: v.name,
                              description: parentProd.description || "",
                              price: vPrice,
                              banners: parentProd.image ? [parentProd.image] : [],
                              entrega_automatica: true,
                              estoque_count: v.stock || parentProd.stock
                          };
                      })
                  };
                  return new Response(JSON.stringify(responseObj), { status: 200, headers: {'Content-Type': 'application/json'} });
              } else {
                  return new Response(JSON.stringify({ code: "CATEGORY_NOT_FOUND" }), { status: 404, headers: {'Content-Type': 'application/json'} });
              }
          } catch(e) {
              console.error("Fetch category products intercept error", e);
          }
      }
      
      if (typeof url === 'string' && url.match(/api\.stormty\.com\/products\/([^\/]+)$/)) {
          const match = url.match(/api\.stormty\.com\/products\/([^\/]+)$/);
          const productId = match ? match[1] : null;
          if (productId) {
              try {
                  const resProds = await originalFetch('/api/products');
                  const prods = await resProds.json();
                  
                  if (productId.includes('_')) {
                      const [parentId, vIndex] = productId.split('_');
                      const product = prods.find(p => p.id === parentId);
                      if (product && product.has_variations && product.variations) {
                          const variationsArr = typeof product.variations === 'string' ? JSON.parse(product.variations) : product.variations;
                          const v = variationsArr[parseInt(vIndex)];
                          if (v) {
                              let vPrice = typeof v.price === 'string' ? parseFloat(v.price.replace(/[^\d,]/g, '').replace(',', '.')) || 0 : v.price;
                              return new Response(JSON.stringify({
                                  _id: productId,
                                  name: v.name,
                                  description: product.description || "",
                                  price: vPrice,
                                  banners: product.image ? [product.image] : [],
                                  entrega_automatica: true,
                                  pode_usar_cupom: true,
                                  active: true,
                                  estoque_count: v.stock || product.stock
                              }), { status: 200, headers: {'Content-Type': 'application/json'} });
                          }
                      }
                  } else {
                      const product = prods.find(p => p.id === productId);
                      if (product) {
                          return new Response(JSON.stringify(mapProduct(product)), { status: 200, headers: {'Content-Type': 'application/json'} });
                      }
                  }
                  return new Response(JSON.stringify({ code: "PRODUCT_NOT_FOUND" }), { status: 404, headers: {'Content-Type': 'application/json'} });
              } catch(e) {
                  console.error("Fetch product intercept error", e);
              }
          }
      }

      if (typeof url === 'string' && url.includes('api.stormty.com/categories/')) {
         return new Response(JSON.stringify([]), { status: 200, headers: {'Content-Type': 'application/json'} });
      }

      return originalFetch(url, options);
    };
</script>
