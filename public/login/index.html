<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = form.querySelector('input[type="email"], input[name="email"]');
            const passInput = form.querySelector('input[type="password"], input[name="password"]');
            
            if (!emailInput || !passInput) return;
            
            const email = emailInput.value;
            const password = passInput.value;
            
            // Check if it's registration based on URL
            const isRegister = window.location.search.includes('mode=register');
            const endpoint = isRegister ? '/api/register' : '/api/login';
            
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/membros';
                } else {
                    alert(data.error || 'Erro na autenticação');
                }
            } catch (err) {
                alert('Erro de conexão');
            }
        });
    }
});
</script>
