<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = form.querySelector('input[type="email"], input[name="email"]');
            const passInput = form.querySelector('input[type="password"], input[name="password"]');
            
            if (!emailInput || !passInput) return;
            
            const email = emailInput.value;
            const password = passInput.value;
            
            // Check if it's registration based on URL
            const isRegister = window.location.search.includes('mode=register');
            const endpoint = isRegister ? '/api/register' : '/api/login';
            
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/membros';
                } else {
                    alert(data.error || 'Erro na autenticação');
                }
            } catch (err) {
                alert('Erro de conexão');
            }
        });
    }
});
</script>

<script>
  document.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a && a.href.startsWith(window.location.origin)) {
      e.preventDefault();
      window.parent.location.href = a.href;
    }
  });
</script>


<script>
  window.addEventListener('load', () => {
    let attempts = 0;
    const tryClick = () => {
      attempts++;
      if (attempts > 50) return; // Stop after 10 seconds (50 * 200ms)
      
      const buttons = Array.from(document.querySelectorAll('button, a'));
      const btn = buttons.find(el => el.textContent && el.textContent.toLowerCase().includes('criar agora'));
      
      if (btn) {
        console.log('Found registration button, clicking it!');
        btn.click();
        
        // Sometimes React needs a moment or a double dispatch
        setTimeout(() => {
            const stillLogin = document.body.textContent.includes('Bem-vindo de volta');
            if (stillLogin) btn.click();
        }, 100);
      } else {
        setTimeout(tryClick, 200);
      }
    };
    setTimeout(tryClick, 300);
  });
</script>
