<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    const otpModal = document.getElementById('otp-modal');
    const otpInput = document.getElementById('otp-input');
    const otpError = document.getElementById('otp-error');
    const otpDesc = document.getElementById('otp-desc');
    const btnConfirmOtp = document.getElementById('btn-confirm-otp');
    const closeOtp = document.getElementById('close-otp');

    let currentEmail = '';
    let currentPassword = '';
    let currentToken = '';

    if (closeOtp) {
        closeOtp.addEventListener('click', () => {
            otpModal.style.display = 'none';
        });
    }

    if (form) {
        // Clonar o formulário para desconectar listeners legados dos chunks do StorM
        const newForm = form.cloneNode(true);
        form.parentNode.replaceChild(newForm, form);

        newForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();

            const emailInput = newForm.querySelector('input[type="email"], input[name="email"]');
            const passInput = newForm.querySelector('input[type="password"], input[name="password"]');
            
            if (!emailInput || !passInput) return;
            
            const email = emailInput.value;
            const password = passInput.value;
            
            // Página de cadastro nativa sempre realiza fluxo de registro
            const isRegister = true;
            
            if (isRegister) {
                // Fluxo de Cadastro com Código OTP
                try {
                    const res = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await res.json();
                    
                    if (res.ok && data.otpRequired) {
                        // Armazena credenciais e token assinado temporariamente
                        currentEmail = email;
                        currentPassword = password;
                        currentToken = data.token;
                        
                        // Abre a modal de verificação
                        otpDesc.innerText = `Digite o código de 6 dígitos que enviamos para ${email}`;
                        otpInput.value = '';
                        otpError.style.display = 'none';
                        otpModal.style.display = 'flex';
                    } else {
                        alert(data.error || 'Erro ao iniciar cadastro');
                    }
                } catch (err) {
                    alert('Erro de conexão');
                }
            }
        });
    }

    // Confirmação do Código OTP inserido pelo usuário
    if (btnConfirmOtp) {
        btnConfirmOtp.addEventListener('click', async () => {
            const code = otpInput.value.trim();
            if (code.length !== 6) {
                otpError.innerText = 'Digite um código válido de 6 dígitos.';
                otpError.style.display = 'block';
                return;
            }

            btnConfirmOtp.innerText = 'Verificando...';
            btnConfirmOtp.disabled = true;
            otpError.style.display = 'none';

            try {
                const res = await fetch('/api/register/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentEmail,
                        password: currentPassword,
                        code,
                        token: currentToken
                    })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Login automático silencioso pós-cadastro
                    try {
                        const loginRes = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: currentEmail, password: currentPassword })
                        });
                        if (loginRes.ok) {
                            otpModal.style.display = 'none';
                            window.location.href = '/produtos';
                            return;
                        }
                    } catch (loginErr) {
                        console.error('Erro no login automático:', loginErr);
                    }
                    
                    // Fallback se o login automático falhar
                    otpModal.style.display = 'none';
                    window.location.href = '/login?registered=true';
                } else {
                    otpError.innerText = data.error || 'Código inválido ou expirado.';
                    otpError.style.display = 'block';
                }
            } catch (err) {
                otpError.innerText = 'Erro ao conectar ao servidor.';
                otpError.style.display = 'block';
            } finally {
                btnConfirmOtp.innerText = 'Confirmar Cadastro';
                btnConfirmOtp.disabled = false;
            }
        });
    }
});
</script>

<script>
  document.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a && a.href.startsWith(window.location.origin)) {
      e.preventDefault();
      window.parent.location.href = a.href;
    }
  });
</script>

<script>
  // Wait for React to hydrate, then click the "Criar conta" button
  window.addEventListener('load', () => {
    const tryClick = (attempts) => {
      if (attempts <= 0) return;
      const elements = Array.from(document.querySelectorAll('*'));
      const btn = elements.find(el => el.textContent && el.textContent.trim() === 'Criar conta');
      if (btn && btn.click) {
        btn.click();
        // Since React might take a few ms to swap the DOM, click it a couple of times just to be sure
      } else {
        setTimeout(() => tryClick(attempts - 1), 100);
      }
    };
    setTimeout(() => tryClick(20), 200);
  });
</script>
</body></html>
